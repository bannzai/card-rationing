<body>
<x-dc>
<helmet>

<div style="width: 1280px; height: 720px; box-sizing: border-box; overflow: hidden; position: relative; font-family: 'Zen Kaku Gothic New', sans-serif; color: #e9e6de; background: #11151c">

  <svg aria-hidden="true" width="600" height="600" viewBox="0 0 600 600" fill="none" stroke="#2c3542" stroke-width="1" style="position: absolute; left: 628px; top: 88px">
    <circle cx="300" cy="300" r="292"></circle>

    <rect x="103.4" y="103.4" width="393.2" height="393.2"></rect>

  <header style="position: absolute; top: 0; left: 0; width: 1280px; height: 56px; box-sizing: border-box; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2c3542; background: #11151c">
    <div style="display: flex; align-items: center; gap: 16px">
      <span style="font-family: 'Shippori Mincho', serif; font-weight: 700; font-size: 19px; letter-spacing: 0.02em">Card Rationing</span>

      <span style="font-size: 13px; color: #a7adb6">苔の参道 第 2 層</span>
    </div>
    <div style="display: flex; align-items: center; gap: 24px">
      <div style="display: flex; align-items: center; gap: 8px">

      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a7adb6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l3 3-3 3-3-3z"></path><path d="M4 11h16a8 8 0 0 1-16 0z"></path><path d="M12 19v2"></path><path d="M9 21h6"></path></svg>

      <button style="height: 36px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 8px; background: #1a2029; border: 1px solid #2c3542; border-radius: 6px; color: #e9e6de; font-family: inherit; font-size: 13px; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="6" width="12" height="15" rx="1.5"></rect><path d="M8 3h10.5A1.5 1.5 0 0 1 20 4.5V17"></path></svg>
        <span>契約 12 枚</span>
      </button>
      <button aria-label="メニュー" style="width: 36px; height: 36px; box-sizing: border-box; padding: 0; display: flex; align-items: center; justify-content: center; background: #1a2029; border: 1px solid #2c3542; border-radius: 6px; color: #e9e6de; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
    </div>
  </header>

  <main style="position: absolute; top: 56px; left: 0; width: 1280px; height: 664px; box-sizing: border-box; padding: 0 64px; display: grid; grid-template-columns: 520px 576px; column-gap: 56px; align-items: center">

    <section style="display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #a7adb6">
        <span style="width: 7px; height: 7px; flex-shrink: 0; background: #d4553a; transform: rotate(45deg)"></span>
        <span>道中の出来事</span>
      </div>
      <h1 style="margin: 12px 0 0; font-family: 'Shippori Mincho', serif; font-size: 40px; font-weight: 700; line-height: 1.2; letter-spacing: 0.04em">契約の祠</h1>
      <p style="margin: 20px 0 0; font-size: 16px; line-height: 1.9; color: #a7adb6">苔むした祠に古い印が刻まれている。供物を捧げれば、ひとつの契約を結び直せる。祠が聞き届ける願いは、ひとつだけだ。</p>

      <div role="group" aria-label="祠での行い" style="margin-top: 32px; display: flex; flex-direction: column; gap: 12px">
        <button aria-pressed="true" style="width: 100%; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 0 19px 0 13px; background: #1a2029; border: 2px solid #d4553a; border-radius: 6px; color: #e9e6de; font-family: inherit; text-align: left; cursor: pointer">
          <span style="width: 36px; height: 36px; box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 1px solid #d4553a; border-radius: 4px; color: #d4553a">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 0 1 13-5.1L19.5 9"></path><path d="M19.5 4v5h-5"></path><path d="M19.5 12a7.5 7.5 0 0 1-13 5.1L4.5 15"></path><path d="M4.5 20v-5h5"></path></svg>
          </span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 16px; font-weight: 700">契約を更新する</span>
            <span style="font-size: 12px; color: #a7adb6">1 枚の残り回数を最大まで戻す</span>
          </span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d4553a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
        <button aria-pressed="false" style="width: 100%; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 0 20px 0 14px; background: #1a2029; border: 1px solid #2c3542; border-radius: 6px; color: #e9e6de; font-family: inherit; text-align: left; cursor: pointer">
          <span style="width: 36px; height: 36px; box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 1px solid #2c3542; border-radius: 4px; color: #a7adb6">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z"></path><path d="M7 17L17 7"></path></svg>
          </span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 16px; font-weight: 700">契約を破棄する</span>
            <span style="font-size: 12px; color: #a7adb6">1 枚をデッキから外す</span>
          </span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a7adb6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
        <button aria-pressed="false" style="width: 100%; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 0 20px 0 14px; background: #1a2029; border: 1px solid #2c3542; border-radius: 6px; color: #e9e6de; font-family: inherit; text-align: left; cursor: pointer">
          <span style="width: 36px; height: 36px; box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 1px solid #2c3542; border-radius: 4px; color: #a7adb6">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z"></path><path d="M12 8.5v7M8.5 12h7"></path></svg>
          </span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 16px; font-weight: 700">新しい契約を結ぶ</span>
            <span style="font-size: 12px; color: #a7adb6">3 体から 1 体を選ぶ</span>
          </span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a7adb6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </div>

      <button style="margin-top: 24px; align-self: flex-start; height: 40px; box-sizing: border-box; padding: 0 16px 0 12px; display: flex; align-items: center; gap: 8px; background: transparent; border: 1px solid #2c3542; border-radius: 6px; color: #a7adb6; font-family: inherit; font-size: 14px; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
        <span>祠を立ち去る</span>
      </button>
    </section>

    <section style="display: flex; flex-direction: column; align-items: center">
      <div style="width: 498px; display: flex; flex-direction: column">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <h2 style="margin: 0; font-family: 'Shippori Mincho', serif; font-size: 22px; font-weight: 700; line-height: 1.4">更新できる契約</h2>
          <span style="font-size: 13px; color: #a7adb6">更新する契約を 1 枚選ぶ</span>
        </div>

        <div role="group" aria-label="更新できる契約" style="margin-top: 32px; display: flex; gap: 24px">

          <div style="width: 150px; display: flex; flex-direction: column; align-items: center; gap: 16px">
            <button aria-pressed="true" style="width: 150px; height: 210px; box-sizing: border-box; display: flex; flex-direction: column; padding: 11px; background: #1f2733; border: 2px solid #d4553a; border-radius: 8px; outline: 2px solid #e9e6de; outline-offset: 4px; transform: translateY(-6px); color: #e9e6de; font-family: inherit; text-align: left; cursor: pointer">
              <span style="width: 100%; display: flex; align-items: center; justify-content: space-between">
                <span style="width: 28px; height: 28px; border-radius: 50%; background: #d4553a; color: #ffffff; display: flex; align-items: center; justify-content: center; font-family: 'Shippori Mincho', serif; font-size: 24px; font-weight: 700; line-height: 1">2</span>
                <span style="padding: 2px 6px; border: 1px solid #d4553a; border-radius: 3px; font-size: 11px; line-height: 1.4; color: #e9e6de">最後の 1 回</span>
              </span>
              <span style="margin-top: 12px; font-family: 'Shippori Mincho', serif; font-size: 17px; font-weight: 700; line-height: 1.3">雷槍の英霊</span>

                  <span style="width: 10px; height: 10px; box-sizing: border-box; border: 1.5px solid #5a6472; transform: rotate(45deg)"></span>
                </span>
                <span style="font-size: 11px; color: #a7adb6">残り 1 / 2</span>
              </span>
            </button>
            <div style="height: 24px; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700">
              <span style="color: #a7adb6">1 / 2</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d4553a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M14 7l5 5-5 5"></path></svg>
              <span style="color: #e9e6de">2 / 2</span>
            </div>
          </div>

          <div style="width: 150px; display: flex; flex-direction: column; align-items: center; gap: 16px">
            <button aria-pressed="false" disabled="disabled" style="width: 150px; height: 210px; box-sizing: border-box; display: flex; flex-direction: column; padding: 11px; background: #1f2733; border: 2px solid #d4553a; border-radius: 8px; color: #e9e6de; font-family: inherit; text-align: left; cursor: default">
              <span style="width: 100%; display: flex; align-items: center; justify-content: space-between">
                <span style="width: 28px; height: 28px; border-radius: 50%; background: #d4553a; color: #ffffff; display: flex; align-items: center; justify-content: center; font-family: 'Shippori Mincho', serif; font-size: 24px; font-weight: 700; line-height: 1">3</span>
                <span style="padding: 2px 6px; border: 1px solid #d4553a; border-radius: 3px; font-size: 11px; line-height: 1.4; color: #e9e6de">最後の 1 回</span>
              </span>
              <span style="margin-top: 12px; font-family: 'Shippori Mincho', serif; font-size: 17px; font-weight: 700; line-height: 1.3">古王の宣告</span>
              <span style="margin-top: 3px; font-size: 11px; color: #a7adb6">攻撃 英霊</span>
              <span style="margin-top: 10px; font-size: 13px; line-height: 1.55">敵 1 体に 40 ダメージ</span>
              <span style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
                <span aria-hidden="true" style="display: flex; gap: 5.5px; padding: 2px">
                  <span style="width: 10px; height: 10px; box-sizing: border-box; background: #d4553a; transform: rotate(45deg)"></span>
                </span>
                <span style="font-size: 11px; color: #a7adb6">残り 1 / 1</span>
              </span>
            </button>
            <div style="height: 24px; display: flex; align-items: center; font-size: 12px; color: #a7adb6">回数は満ちている</div>
          </div>

          <div style="width: 150px; display: flex; flex-direction: column; align-items: center; gap: 16px">
            <button aria-pressed="false" style="width: 150px; height: 210px; box-sizing: border-box; display: flex; flex-direction: column; padding: 12px; background: #1f2733; border: 1px solid #3a4554; border-radius: 8px; color: #e9e6de; font-family: inherit; text-align: left; cursor: pointer">
              <span style="width: 100%; display: flex; align-items: center; justify-content: space-between">
                <span style="width: 28px; height: 28px; border-radius: 50%; background: #d4553a; color: #ffffff; display: flex; align-items: center; justify-content: center; font-family: 'Shippori Mincho', serif; font-size: 24px; font-weight: 700; line-height: 1">1</span>
              </span>
              <span style="margin-top: 12px; font-family: 'Shippori Mincho', serif; font-size: 17px; font-weight: 700; line-height: 1.3">守りの風</span>
              <span style="margin-top: 3px; font-size: 11px; color: #a7adb6">防御 精霊</span>
              <span style="margin-top: 10px; font-size: 13px; line-height: 1.55"><span style="color: #5fa8ae; font-weight: 700">防御</span> 5</span>
              <span style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
                <span aria-hidden="true" style="display: flex; gap: 5.5px; padding: 2px">
                  <span style="width: 10px; height: 10px; box-sizing: border-box; background: #d4553a; transform: rotate(45deg)"></span>
                  <span style="width: 10px; height: 10px; box-sizing: border-box; background: #d4553a; transform: rotate(45deg)"></span>
                  <span style="width: 10px; height: 10px; box-sizing: border-box; background: #d4553a; transform: rotate(45deg)"></span>
                  <span style="width: 10px; height: 10px; box-sizing: border-box; background: #d4553a; transform: rotate(45deg)"></span>
                  <span style="width: 10px; height: 10px; box-sizing: border-box; background: #d4553a; transform: rotate(45deg)"></span>
                  <span style="width: 10px; height: 10px; box-sizing: border-box; border: 1.5px solid #5a6472; transform: rotate(45deg)"></span>
                  <span style="width: 10px; height: 10px; box-sizing: border-box; border: 1.5px solid #5a6472; transform: rotate(45deg)"></span>
                  <span style="width: 10px; height: 10px; box-sizing: border-box; border: 1.5px solid #5a6472; transform: rotate(45deg)"></span>
                </span>
                <span style="font-size: 11px; color: #a7adb6">残り 5 / 8</span>
              </span>
            </button>
            <div style="height: 24px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #a7adb6">
              <span>5 / 8</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M14 7l5 5-5 5"></path></svg>
              <span>8 / 8</span>
            </div>
          </div>

        </div>

        <div style="margin-top: 28px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #a7adb6">
            <span>供物を 1 つ捧げる</span>
            <span>供物 3 → 2</span>
          </div>
          <button style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 20px; background: #d4553a; border: none; border-radius: 6px; color: #ffffff; font-family: inherit; font-size: 24px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer">雷槍の英霊の契約を更新する</button>
        </div>
      </div>
    </section>

  </main>
</div>
</x-dc>
