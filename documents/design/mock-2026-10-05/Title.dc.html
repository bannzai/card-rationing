<div style="width: 1280px; height: 720px; box-sizing: border-box; overflow: hidden; position: relative; font-family: 'Zen Kaku Gothic New', sans-serif; color: #e9e6de; background: #11151c">
  <svg aria-hidden="true" width="680" height="680" viewBox="0 0 680 680" fill="none" stroke="#2c3542" stroke-width="1" style="position: absolute; left: 300px; top: 20px; z-index: 0; pointer-events: none">
    <circle cx="340" cy="340" r="336"></circle>
    <circle cx="340" cy="340" r="324"></circle>
    <polygon points="340,16 664,340 340,664 16,340"></polygon>
    <polygon points="110.9,110.9 569.1,110.9 569.1,569.1 110.9,569.1"></polygon>
    <circle cx="340" cy="340" r="200"></circle>
    <circle cx="340" cy="340" r="190"></circle>
    <polygon points="340,150 530,340 340,530 150,340"></polygon>
    <polygon points="340,4 352,16 340,28 328,16"></polygon>
    <polygon points="664,328 676,340 664,352 652,340"></polygon>
    <polygon points="340,652 352,664 340,676 328,664"></polygon>
    <polygon points="16,328 28,340 16,352 4,340"></polygon>
  </svg>

  <div style="position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; padding-top: 140px; box-sizing: border-box">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
      <h1 style="margin: 0; font-family: 'Shippori Mincho', serif; font-weight: 700; font-size: 72px; line-height: 1.15; letter-spacing: 0.02em; color: #e9e6de">Card Rationing</h1>
      <p style="margin: 0; font-size: 20px; line-height: 1.5; letter-spacing: 0.08em; color: #a7adb6">命じられる回数は 契約で決まっている</p>
    </div>

    <nav aria-label="メインメニュー" style="display: flex; flex-direction: column; gap: 12px; margin-top: 64px">
      <button type="button" style="width: 280px; height: 48px; box-sizing: border-box; padding: 0; border: 1px solid #d4553a; border-radius: 6px; background: #d4553a; color: #ffffff; font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 700; font-size: 24px; line-height: 1; letter-spacing: 0.1em; cursor: pointer">巡礼を始める</button>
      <button type="button" style="width: 280px; height: 48px; box-sizing: border-box; padding: 0; border: 1px solid #2c3542; border-radius: 6px; background: #1a2029; color: #e9e6de; font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 500; font-size: 24px; line-height: 1; letter-spacing: 0.1em; cursor: pointer">続きから</button>
      <button type="button" style="width: 280px; height: 48px; box-sizing: border-box; padding: 0; border: 1px solid #2c3542; border-radius: 6px; background: #1a2029; color: #e9e6de; font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 500; font-size: 24px; line-height: 1; letter-spacing: 0.1em; cursor: pointer">設定</button>
      <button type="button" style="width: 280px; height: 48px; box-sizing: border-box; padding: 0; border: 1px solid #2c3542; border-radius: 6px; background: #1a2029; color: #e9e6de; font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 500; font-size: 24px; line-height: 1; letter-spacing: 0.1em; cursor: pointer">終了</button>
    </nav>
  </div>

  <p style="position: absolute; right: 24px; bottom: 20px; z-index: 1; margin: 0; font-size: 12px; line-height: 1; letter-spacing: 0.04em; color: #a7adb6">バージョン 0.1.0</p>

return {};
