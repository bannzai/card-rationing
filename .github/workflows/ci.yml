name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# ランナーは ubuntu-24.04 に固定する。ubuntu-latest は 2026-10-19 から Ubuntu 26 へ移る (run の notice)。撮影・録画の
# job は apt のパッケージ名と、Mesa llvmpipe が出す WARNING の文言 (Makefile の WINDOWED_LOG_NOISE) に依存するため、
# イメージを上げる時は別の PR で確かめる
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"
      - name: gdlint
        run: make lint

  check-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: godot
        uses: ./.github/actions/setup-godot
        with:
          templates: >-
            templates/linux_release.x86_64 templates/linux_debug.x86_64
            templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe
            templates/windows_release_x86_64_console.exe templates/windows_debug_x86_64_console.exe
            templates/macos.zip
      - name: Import assets and boot check
        run: make check GODOT="${{ steps.godot.outputs.godot }}"
      - name: Selfcheck
        run: make selfcheck GODOT="${{ steps.godot.outputs.godot }}"
      - name: Integration
        run: make integration GODOT="${{ steps.godot.outputs.godot }}"
      - name: Export desktop builds
        run: make build-all GODOT="${{ steps.godot.outputs.godot }}"
      # upload-artifact はファイルの実行権限を保持しないため、Linux のバイナリと PCK は権限を保持する tar にまとめる
      # (macOS は export 自体が zip、Windows は実行権限を使わない)
      - name: Package Linux build
        run: tar -czf build/card-rationing-linux.tar.gz -C build linux
      # import が生成した .uid / .import が commit されていなければ失敗させ、artifact に上げる (開発マシンでは Godot を
      # 起動しないため、ここで取り出して commit する。手順は AGENTS.md「検証方法」、方針は documents/DIRECTION.md)。
      # 検証とエクスポートの結果を隠さないよう最後に置く
      - name: Check untracked generated files (.uid / .import)
        id: generated
        if: always()
        run: |
          # 未追跡のものに加え、commit 済みで Godot が書き換えたもの (版の更新で中身が変わる等) も対象にする
          untracked=$(git ls-files --others --modified --exclude-standard -- '*.uid' '*.import' | sort -u)
          if [ -z "$untracked" ]; then
            echo "未 commit の .uid / .import はありません"
            exit 0
          fi
          mkdir -p tmp/generated
          printf '%s\n' "$untracked" | while IFS= read -r file; do
            if [ -f "$file" ]; then
              cp --parents "$file" tmp/generated/
            fi
          done
          printf '%s\n' "$untracked"
          echo "::error::未 commit の .uid / .import が $(printf '%s\n' "$untracked" | wc -l) 件あります。artifact card-rationing-generated を取り出して commit してください (AGENTS.md「検証方法」)"
          exit 1
      - name: Upload untracked generated files
        if: always() && steps.generated.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: card-rationing-generated
          path: tmp/generated/
          if-no-files-found: error
          retention-days: 7
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: card-rationing-check-logs
          path: tmp/*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: card-rationing-desktop
          path: |
            build/windows/
            build/macos/
            build/card-rationing-linux.tar.gz
          retention-days: 7

  # 戦略 bot の自動テストプレイ。3 つの戦略に 1 幕を各 200 ラン遊ばせた集計 (tmp/simulate.json) を artifact に残す。
  # 数値は documents/DIRECTION.md の判定基準に照らして判定日に読むので、しきい値では失敗にしない。判定日
  # (DIRECTION.md の cycle_days: 14) に読めるよう、この artifact だけ 30 日残す
  simulate:
    runs-on: ubuntu-24.04
    # 実行時間の上限 (issue #10 の「10 分を超えない」に、Godot の用意と import の分を足した値)。make simulate の
    # フレームの上限は実行時間を縛らないため、ここで縛る
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: godot
        uses: ./.github/actions/setup-godot
        with:
          # エディタバイナリで動かすため export templates は要らない (tpz を取得しない)
          templates: ""
      - name: Simulate
        run: make simulate GODOT="${{ steps.godot.outputs.godot }}"
      - name: Upload simulate result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: card-rationing-simulate
          path: |
            tmp/simulate.json
            tmp/simulate.log
            tmp/simulate.godot.log
          if-no-files-found: warn
          retention-days: 30

  # 描画付きの検証。headless の check / selfcheck / integration では見た目の崩れを検出できないため、
  # Xvfb + Mesa llvmpipe (ソフトウェア GL) 上で代表画面の撮影・起動の録画・戦略 bot が 1 幕を通して遊ぶテストプレイの
  # 録画を行い artifact に残す。
  # PR を開いた agent は artifact をダウンロードして PNG と mp4 を目視してから完了報告する (AGENTS.md「検証方法」)
  screenshot-and-movie:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: godot
        uses: ./.github/actions/setup-godot
        with:
          # エディタバイナリで動かすため export templates は要らない (tpz を取得しない)
          templates: ""
      - name: Start Xvfb with software GL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ffmpeg libgl1-mesa-dri \
            libxcursor1 libxinerama1 libxrandr2 libxi6 libxext6 libxkbcommon0
          nohup Xvfb :99 -screen 0 1280x720x24 > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          for _ in $(seq 1 30); do
            [ -S /tmp/.X11-unix/X99 ] && break
            sleep 1
          done
          [ -S /tmp/.X11-unix/X99 ] || { cat "$RUNNER_TEMP/xvfb.log"; exit 1; }
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
      - name: Screenshot
        run: make screenshot GODOT="${{ steps.godot.outputs.godot }}"
      - name: Movie
        run: make movie GODOT="${{ steps.godot.outputs.godot }}"
      - name: Playtest
        run: make playtest GODOT="${{ steps.godot.outputs.godot }}"
      - name: Upload screenshots and movie
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: card-rationing-screenshot-and-movie
          path: |
            tmp/screenshot-*.png
            tmp/movie.mp4
            tmp/playtest.mp4
            tmp/playtest-*.png
            tmp/*.log
          if-no-files-found: warn
          retention-days: 7
